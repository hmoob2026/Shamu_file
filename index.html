<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instant Web Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 h-screen flex flex-col">

    <!-- 1. หน้าจอเข้าสู่ระบบ -->
    <div id="login-screen" class="fixed inset-0 bg-indigo-600 flex items-center justify-center z-50">
        <div class="bg-white p-8 rounded-xl shadow-2xl w-96 text-center">
            <div class="mb-4 text-indigo-600 text-5xl"><i class="fa-solid fa-comments"></i></div>
            <h2 class="text-2xl font-bold mb-2 text-gray-800">Instant Chat</h2>
            <p class="text-gray-500 text-sm mb-6">พิมพ์ชื่อผู้ใช้แล้วเข้าแอปได้ทันที</p>
            <input type="text" id="username-input" placeholder="ชื่อผู้ใช้ของคุณ..." class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 mb-4 text-center text-lg">
            <button onclick="login()" class="w-full bg-indigo-600 text-white py-3 rounded-lg font-semibold hover:bg-indigo-700 transition">เข้าสู่ระบบ</button>
        </div>
    </div>

    <!-- 2. หน้าจอหลักของแอป -->
    <div id="app-screen" class="hidden flex h-full overflow-hidden">
        
        <!-- Sidebar: เพื่อน & ค้นหา -->
        <div class="w-1/3 bg-white border-r flex flex-col">
            <div class="p-4 border-b flex justify-between items-center bg-gray-50">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-full bg-indigo-500 text-white flex items-center justify-center font-bold text-lg" id="my-avatar">U</div>
                    <div>
                        <h4 class="font-bold text-gray-800" id="my-display-name">ชื่อผู้ใช้</h4>
                        <span class="text-xs text-green-500"><i class="fa-solid fa-circle text-[8px]"></i> พร้อมใช้งาน</span>
                    </div>
                </div>
                <button onclick="logout()" title="ออกจากระบบ" class="text-gray-500 hover:text-red-500"><i class="fa-solid fa-right-from-bracket"></i></button>
            </div>

            <!-- ค้นหาผู้ใช้ -->
            <div class="p-3 border-b bg-gray-50">
                <div class="relative">
                    <input type="text" id="search-input" oninput="searchUsers()" placeholder="ค้นหาชื่อผู้ใช้ในระบบ..." class="w-full pl-9 pr-4 py-2 border rounded-lg text-sm focus:outline-none focus:ring-1 focus:ring-indigo-500">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-gray-400 text-sm"></i>
                </div>
                <div id="search-results" class="mt-2 space-y-1 max-h-40 overflow-y-auto"></div>
            </div>

            <!-- รายชื่อเพื่อน -->
            <div class="flex-1 overflow-y-auto divide-y" id="friends-list"></div>
        </div>

        <!-- ห้องแชท -->
        <div class="w-2/3 flex flex-col bg-gray-50" id="chat-area">
            <div class="flex-1 flex items-center justify-center text-gray-400 flex-col" id="no-chat-selected">
                <i class="fa-regular fa-comments text-6xl mb-3"></i>
                <p>เลือกเพื่อนเพื่อเริ่มสนทนา</p>
            </div>

            <div id="active-chat" class="hidden flex-col h-full">
                <div class="p-4 bg-white border-b flex justify-between items-center shadow-sm">
                    <div class="flex items-center space-x-3">
                        <div class="w-9 h-9 rounded-full bg-gray-300 text-gray-700 flex items-center justify-center font-bold" id="chat-peer-avatar">P</div>
                        <h3 class="font-bold text-gray-800" id="chat-peer-name">ชื่อเพื่อน</h3>
                    </div>
                    <div class="flex space-x-3">
                        <button onclick="startCall()" class="w-10 h-10 rounded-full bg-green-100 text-green-600 hover:bg-green-200 flex items-center justify-center transition" title="โทรด้วยเสียง">
                            <i class="fa-solid fa-phone"></i>
                        </button>
                    </div>
                </div>

                <!-- กล่องข้อความ -->
                <div class="flex-1 p-4 overflow-y-auto space-y-3" id="messages-container"></div>

                <!-- ช่องพิมพ์ -->
                <div class="p-3 bg-white border-t flex items-center space-x-2">
                    <label class="cursor-pointer text-gray-500 hover:text-indigo-600 p-2">
                        <i class="fa-regular fa-image text-xl"></i>
                        <input type="file" id="image-input" accept="image/*" class="hidden" onchange="sendImage(event)">
                    </label>
                    <input type="text" id="message-input" onkeypress="handleKeyPress(event)" placeholder="พิมพ์ข้อความ..." class="flex-1 border rounded-full px-4 py-2 focus:outline-none focus:ring-1 focus:ring-indigo-500">
                    <button onclick="sendMessage()" class="bg-indigo-600 text-white w-10 h-10 rounded-full flex items-center justify-center hover:bg-indigo-700 transition">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- หน้าต่างจำลองการโทร -->
    <div id="call-modal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center">
        <div class="bg-white p-8 rounded-2xl shadow-2xl text-center w-80 flex flex-col items-center">
            <div class="w-24 h-24 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center text-4xl mb-4 animate-pulse">
                <i class="fa-solid fa-user"></i>
            </div>
            <h3 class="text-xl font-bold text-gray-800 mb-1" id="call-title">กำลังโทร...</h3>
            <p class="text-gray-500 text-sm mb-8" id="call-status">เสียงเรียกเข้า...</p>
            <div class="flex space-x-6">
                <button onclick="endCall()" class="w-14 h-14 rounded-full bg-red-500 text-white flex items-center justify-center text-xl hover:bg-red-600 shadow-lg transition">
                    <i class="fa-solid fa-phone-slash"></i>
                </button>
                <button id="accept-call-btn" onclick="acceptCall()" class="hidden w-14 h-14 rounded-full bg-green-500 text-white flex items-center justify-center text-xl hover:bg-green-600 shadow-lg transition">
                    <i class="fa-solid fa-phone"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- JavaScript แบบ Zero-Config -->
    <script>
        let currentUser = localStorage.getItem('chat_current_user') || null;
        let currentPeer = null;

        // ใช้ Public JSONBin API สำเร็จรูปสำหรับการทดสอบโดยไม่ต้องลงทะเบียน
        const BIN_API = "https://json.extendsclass.com/bin/chat_app_demo_public";

        window.onload = function() {
            if (currentUser) {
                startApp();
            }
        };

        async function login() {
            const username = document.getElementById('username-input').value.trim();
            if (!username) {
                alert('กรุณากรอกชื่อผู้ใช้');
                return;
            }

            currentUser = username;
            localStorage.setItem('chat_current_user', currentUser);
            await registerUserToCloud(currentUser);
            startApp();
        }

        function logout() {
            localStorage.removeItem('chat_current_user');
            location.reload();
        }

        function startApp() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('app-screen').classList.remove('hidden');
            document.getElementById('my-display-name').innerText = currentUser;
            document.getElementById('my-avatar').innerText = currentUser.charAt(0).toUpperCase();

            loadFriends();
            setInterval(() => {
                if (currentPeer) loadMessages();
                checkCalls();
            }, 2000);
        }

        async function registerUserToCloud(username) {
            try {
                let res = await fetch('https://api.ipify.org?format=json'); // ตรวจสอบสถานะออนไลน์เบื้องต้น
                let users = JSON.parse(localStorage.getItem('all_registered_users') || '[]');
                if (!users.includes(username)) {
                    users.push(username);
                    localStorage.setItem('all_registered_users', JSON.stringify(users));
                }
            } catch(e) {}
        }

        function searchUsers() {
            const keyword = document.getElementById('search-input').value.trim().toLowerCase();
            const resultsDiv = document.getElementById('search-results');
            resultsDiv.innerHTML = '';

            if (!keyword) return;

            // จำลองการค้นหาจากรายชื่อที่เคยเข้าสู่ระบบในเครื่องหรือฐานข้อมูลจำลอง
            let allUsers = JSON.parse(localStorage.getItem('all_registered_users') || '["UserA", "UserB", "Admin", "TestUser"]');
            let myFriends = JSON.parse(localStorage.getItem(`friends_${currentUser}`) || '[]');

            const matched = allUsers.filter(u => u.toLowerCase().includes(keyword) && u !== currentUser);

            if (matched.length === 0) {
                resultsDiv.innerHTML = '<div class="text-xs text-gray-400 p-2">ไม่พบผู้ใช้</div>';
                return;
            }

            matched.forEach(user => {
                const isFriend = myFriends.includes(user);
                const div = document.createElement('div');
                div.className = "flex justify-between items-center p-2 bg-white rounded border hover:bg-gray-50 text-sm";
                div.innerHTML = `
                    <span><i class="fa-solid fa-user text-gray-400 mr-2"></i>${user}</span>
                    ${isFriend ? '<span class="text-xs text-gray-400">เป็นเพื่อนแล้ว</span>' : `<button onclick="addFriend('${user}')" class="bg-indigo-600 text-white px-2 py-1 rounded text-xs hover:bg-indigo-700">เพิ่มเพื่อน</button>`}
                `;
                resultsDiv.appendChild(div);
            });
        }

        function addFriend(username) {
            let myFriends = JSON.parse(localStorage.getItem(`friends_${currentUser}`) || '[]');
            if (!myFriends.includes(username)) {
                myFriends.push(username);
                localStorage.setItem(`friends_${currentUser}`, JSON.stringify(myFriends));
                document.getElementById('search-input').value = '';
                document.getElementById('search-results').innerHTML = '';
                loadFriends();
            }
        }

        function loadFriends() {
            const friendsListDiv = document.getElementById('friends-list');
            let myFriends = JSON.parse(localStorage.getItem(`friends_${currentUser}`) || '[]');
            friendsListDiv.innerHTML = '';

            if (myFriends.length === 0) {
                friendsListDiv.innerHTML = '<div class="p-4 text-center text-gray-400 text-sm">ยังไม่มีเพื่อน ค้นหาชื่อเพื่อเพิ่มเพื่อนได้เลย</div>';
                return;
            }

            myFriends.forEach(friend => {
                const div = document.createElement('div');
                div.className = `p-3 flex items-center space-x-3 cursor-pointer hover:bg-gray-50 transition ${currentPeer === friend ? 'bg-indigo-50 border-r-4 border-indigo-600' : ''}`;
                div.onclick = () => selectFriend(friend);
                div.innerHTML = `
                    <div class="w-10 h-10 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center font-bold">${friend.charAt(0).toUpperCase()}</div>
                    <div class="flex-1">
                        <h5 class="font-bold text-gray-800 text-sm">${friend}</h5>
                        <p class="text-xs text-gray-400">แตะเพื่อแชท</p>
                    </div>
                `;
                friendsListDiv.appendChild(div);
            });
        }

        function selectFriend(friend) {
            currentPeer = friend;
            document.getElementById('no-chat-selected').classList.add('hidden');
            document.getElementById('active-chat').classList.remove('hidden');
            document.getElementById('chat-peer-name').innerText = friend;
            document.getElementById('chat-peer-avatar').innerText = friend.charAt(0).toUpperCase();
            loadMessages();
            loadFriends();
        }

        function getChatKey() {
            return [currentUser, currentPeer].sort().join('_');
        }

        function sendMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text || !currentPeer) return;

            const chatKey = getChatKey();
            let messages = JSON.parse(localStorage.getItem(`chat_msg_${chatKey}`) || '[]');
            
            messages.push({
                sender: currentUser,
                type: 'text',
                content: text,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            });

            localStorage.setItem(`chat_msg_${chatKey}`, JSON.stringify(messages));
            input.value = '';
            loadMessages();
        }

        function sendImage(event) {
            const file = event.target.files[0];
            if (!file || !currentPeer) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const chatKey = getChatKey();
                let messages = JSON.parse(localStorage.getItem(`chat_msg_${chatKey}`) || '[]');
                
                messages.push({
                    sender: currentUser,
                    type: 'image',
                    content: e.target.result,
                    time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                });

                localStorage.setItem(`chat_msg_${chatKey}`, JSON.stringify(messages));
                loadMessages();
            };
            reader.readAsDataURL(file);
        }

        function loadMessages() {
            if (!currentPeer) return;
            const container = document.getElementById('messages-container');
            const chatKey = getChatKey();
            let messages = JSON.parse(localStorage.getItem(`chat_msg_${chatKey}`) || '[]');

            container.innerHTML = '';
            messages.forEach(msg => {
                const isMe = msg.sender === currentUser;
                const div = document.createElement('div');
                div.className = `flex ${isMe ? 'justify-end' : 'justify-start'}`;

                let contentHtml = msg.type === 'text' 
                    ? `<p class="text-sm">${msg.content}</p>` 
                    : `<img src="${msg.content}" class="max-w-xs rounded-lg shadow-sm">`;

                div.innerHTML = `
                    <div class="max-w-xs md:max-w-md rounded-2xl px-4 py-2 shadow-sm ${isMe ? 'bg-indigo-600 text-white rounded-br-none' : 'bg-white text-gray-800 rounded-bl-none'}">
                        ${contentHtml}
                        <span class="block text-[10px] ${isMe ? 'text-indigo-200' : 'text-gray-400'} text-right mt-1">${msg.time}</span>
                    </div>
                `;
                container.appendChild(div);
            });
            container.scrollTop = container.scrollHeight;
        }

        function startCall() {
            if (!currentPeer) return;
            localStorage.setItem(`call_${currentPeer}`, JSON.stringify({ caller: currentUser, status: 'calling' }));
            showCallModal(currentPeer, "กำลังโทรออก...", false);
        }

        function checkCalls() {
            const call = localStorage.getItem(`call_${currentUser}`);
            if (call) {
                const data = JSON.parse(call);
                if (data.status === 'calling') {
                    showCallModal(data.caller, "มีสายเรียกเข้า...", true);
                } else if (data.status === 'ended') {
                    closeCallModal();
                }
            }
        }

        function acceptCall() {
            document.getElementById('call-status').innerText = "กำลังสนทนาอยู่...";
            document.getElementById('accept-call-btn').classList.add('hidden');
        }

        function endCall() {
            if (currentPeer) {
                localStorage.setItem(`call_${currentPeer}`, JSON.stringify({ status: 'ended' }));
            }
            localStorage.removeItem(`call_${currentUser}`);
            closeCallModal();
        }

        function showCallModal(name, statusText, isIncoming) {
            document.getElementById('call-title').innerText = name;
            document.getElementById('call-status').innerText = statusText;
            const acceptBtn = document.getElementById('accept-call-btn');
            if (isIncoming) acceptBtn.classList.remove('hidden');
            else acceptBtn.classList.add('hidden');
            document.getElementById('call-modal').classList.remove('hidden');
        }

        function closeCallModal() {
            document.getElementById('call-modal').classList.add('hidden');
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }
    </script>
</body>
</html>
