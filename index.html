<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat App - GitHub API</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        .tabs { display: flex; margin-bottom: 20px; border-bottom: 2px solid #eee; }
        .tab { flex: 1; padding: 10px; cursor: pointer; font-weight: bold; color: #666; border-bottom: 2px solid transparent; margin-bottom: -2px; }
        .tab.active { color: #2ea44f; border-bottom: 2px solid #2ea44f; }
        input, button { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background: #2ea44f; color: white; border: none; font-weight: bold; cursor: pointer; }
        button:hover { background: #2c974b; }
        .form-section { display: none; }
        .form-section.active { display: block; }
    </style>
</head>
<body>

    <div class="card">
        <div class="tabs">
            <div class="tab active" onclick="switchTab('login')">ลงชื่อเข้าใช้</div>
            <div class="tab" onclick="switchTab('register')">ลงทะเบียน</div>
        </div>

        <div id="login-section" class="form-section active">
            <h2>เข้าสู่ระบบ</h2>
            <input type="email" id="login-email" placeholder="อีเมล (Email)">
            <input type="password" id="login-pin" maxlength="4" placeholder="รหัส PIN 4 หลัก">
            <button onclick="handleLogin()">ลงชื่อเข้าใช้</button>
            <p id="login-status" style="color: red; font-size: 14px;"></p>
        </div>

        <div id="register-section" class="form-section">
            <h2>สมัครสมาชิก</h2>
            <input type="email" id="reg-email" placeholder="อีเมล (Email)">
            <input type="password" id="reg-pin" maxlength="4" placeholder="รหัส PIN 4 หลัก">
            <button onclick="handleRegister()">ลงทะเบียน</button>
            <p id="reg-status" style="color: red; font-size: 14px;"></p>
        </div>
    </div>

    <script>
        const GITHUB_TOKEN = "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";
        const REPO_OWNER = "hmoobcode";
        const REPO_NAME = "UST_th";
        const FILE_PATH = "name.txt";

        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.form-section').forEach(s => s.classList.remove('active'));
            
            if (tabName === 'login') {
                document.querySelectorAll('.tab')[0].classList.add('active');
                document.getElementById('login-section').classList.add('active');
            } else {
                document.querySelectorAll('.tab')[1].classList.add('active');
                document.getElementById('register-section').classList.add('active');
            }
        }

        async function getFileData() {
            try {
                const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`, {
                    headers: { "Authorization": `token ${GITHUB_TOKEN}` }
                });
                if (res.ok) {
                    const json = await res.json();
                    return { data: JSON.parse(atob(json.content)), sha: json.sha };
                }
            } catch (err) {
                console.error(err);
            }
            return { data: {}, sha: "" };
        }

        async function handleLogin() {
            const email = document.getElementById('login-email').value.trim();
            const pin = document.getElementById('login-pin').value.trim();
            const statusEl = document.getElementById('login-status');

            if (!email || pin.length !== 4) {
                statusEl.innerText = "กรุณากรอกอีเมลและรหัส PIN ให้ครบถ้วน";
                return;
            }

            statusEl.innerText = "กำลังตรวจสอบข้อมูล...";

            const { data } = await getFileData();

            if (!data[email]) {
                statusEl.innerText = "tsis tau sau npe";
                return;
            }

            if (data[email].pin !== pin) {
                statusEl.innerText = "lahav tsis raug";
                return;
            }

            alert("ยินดีต้อนรับกลับมา, " + email);
            statusEl.style.color = "green";
            statusEl.innerText = "เข้าสู่ระบบสำเร็จ!";
        }

        async function handleRegister() {
            const email = document.getElementById('reg-email').value.trim();
            const pin = document.getElementById('reg-pin').value.trim();
            const statusEl = document.getElementById('reg-status');

            if (!email || pin.length !== 4) {
                statusEl.innerText = "กรุณากรอกอีเมลและรหัส PIN ให้ครบถ้วน";
                return;
            }

            statusEl.innerText = "กำลังบันทึกข้อมูล...";

            const { data, sha } = await getFileData();

            if (data[email]) {
                statusEl.innerText = "อีเมลนี้มีบัญชีอยู่ในระบบแล้ว";
                return;
            }

            data[email] = { pin: pin, avatar: "" };
            const contentEncoded = btoa(JSON.stringify(data, null, 2));

            const putRes = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`, {
                method: "PUT",
                headers: {
                    "Authorization": `token ${GITHUB_TOKEN}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    message: `Register user: ${email}`,
                    content: contentEncoded,
                    sha: sha
                })
            });

            if (putRes.ok || putRes.status === 201) {
                alert("ลงทะเบียนสำเร็จ! สามารถเข้าสู่ระบบได้เลย");
                statusEl.style.color = "green";
                statusEl.innerText = "สำเร็จ!";
                switchTab('login');
            } else {
                const errJson = await putRes.json();
                statusEl.innerText = "เกิดข้อผิดพลาด: " + errJson.message;
            }
        }
    </script>
</body>
</html>
